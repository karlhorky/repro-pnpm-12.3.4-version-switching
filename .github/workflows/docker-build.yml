name: Docker build
on: [push]
jobs:
  lint-and-test:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          cat > Dockerfile <<'EOF'
          FROM node:24-alpine

          ENV PNPM_HOME="/pnpm"
          ENV PATH="$PNPM_HOME/bin:$PATH"

          RUN wget -qO- https://get.pnpm.io/install.sh | ENV="$HOME/.shrc" SHELL="$(which sh)" PNPM_VERSION="12.3.4" sh -
          RUN pnpm --version

          WORKDIR /app
          RUN echo '{ "packageManager": "pnpm@11.26.0" }' > package.json
          RUN pnpm --version
          EOF
      - run: docker build --no-cache --progress=plain .
